name: Feature Branch - Code Check

on:
  push:
    branches:
      - feature/ultimate-all-in-one-mindvault
  pull_request:
    branches:
      - feature/ultimate-all-in-one-mindvault
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mindvault-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: Format and analyze Flutter source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift and Riverpod sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format generated Drift binding
        run: dart format lib/core/database/database.g.dart

      - name: Verify generated source scope
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r changed; do
            [[ -z "$changed" ]] && continue
            if [[ "$changed" != "lib/core/database/database.g.dart" ]]; then
              echo "::error::Unexpected generated-source change: $changed"
              exit 1
            fi
          done < <(git diff --name-only)

      - name: Commit regenerated Drift binding on branch pushes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/core/database/database.g.dart; then
            echo "Generated Drift binding is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/database/database.g.dart
          git commit -m "build: regenerate Drift database bindings"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify generated sources on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- lib

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze
