name: Feature Branch - Code Check

on:
  push:
    branches:
      - feature/ultimate-all-in-one-mindvault
  pull_request:
    branches:
      - feature/ultimate-all-in-one-mindvault
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mindvault-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: Format and analyze Flutter source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Migrate to standalone Material UI
        run: dart fix --apply --code=migrate_design_widgets

      - name: Generate Drift and Riverpod sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting on pull requests
        if: github.event_name == 'pull_request'
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Apply Dart formatting on branch runs
        if: github.event_name != 'pull_request'
        run: dart format lib test

      - name: Commit formatting corrections when needed
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git add lib test pubspec.yaml pubspec.lock
          if git diff --cached --quiet; then
            echo "Dart sources and dependency lockfile are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: migrate Material UI and lock dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Static analysis
        run: flutter analyze
