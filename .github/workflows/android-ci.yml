name: Feature Branch - Code Check

on:
  push:
    branches:
      - feature/ultimate-all-in-one-mindvault
      - feature/hybrid-native-architecture
  pull_request:
    branches:
      - feature/ultimate-all-in-one-mindvault
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mindvault-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: Format and analyze Flutter source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift and Riverpod sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze
