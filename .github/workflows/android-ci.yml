name: Feature Branch - Code Check

on:
  push:
    branches:
      - feature/ultimate-all-in-one-mindvault
  pull_request:
    branches:
      - feature/ultimate-all-in-one-mindvault
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindvault-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: Format and analyze Flutter source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Generate missing native platform scaffolding
        run: bash tool/regenerate_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift and Riverpod sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Normalize generated Drift binding
        run: dart format lib/core/database/database.g.dart

      - name: Verify generated and dependency files are committed
        run: git diff --exit-code -- analysis_options.yaml pubspec.lock lib

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze
