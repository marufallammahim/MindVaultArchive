name: Android CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing native platform scaffolding
        run: bash tool/regenerate_platforms.sh
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Check formatting
        run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mindvault-archive-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
