name: Temporary Dart Format Repair

on:
  push:
    branches:
      - feature/ultimate-all-in-one-mindvault
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format Dart source
        run: dart format lib/features/search/data/archive_search_service.dart test/archive_search_service_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet -- lib/features/search/data/archive_search_service.dart test/archive_search_service_test.dart; then
            echo "Dart files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/search/data/archive_search_service.dart test/archive_search_service_test.dart
          git commit -m "style: apply Dart formatter to source and tests"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
