name: Format Dart Sources

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dart-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve package configuration
        run: flutter pub get

      - name: Format Dart source and tests
        run: dart format lib test

      - name: Commit formatting changes
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test; then
            echo "Dart files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format Dart source and tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
