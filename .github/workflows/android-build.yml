name: Android build

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold when missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.marufallammahim --project-name mindvault_archive .
            sed -i 's/com.marufallammahim.mindvault_archive/com.marufallammahim.mindvaultarchive/g' android/app/build.gradle
          fi
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mindvault-archive-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
