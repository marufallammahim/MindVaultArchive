name: Android Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        options: [release, debug]
        default: release
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform scaffolding
        run: bash tool/regenerate_platforms.sh
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK
        run: flutter build apk ${{ github.event.inputs.build_type == 'debug' && '--debug' || '--release' }}
      - name: Build App Bundle
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: flutter build appbundle --release
      - name: Collect build outputs
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -exec cp {} dist/ \;
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab dist/
          fi
          printf 'branch=%s\ncommit=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > dist/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mindvault-archive-android-${{ github.run_number }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
