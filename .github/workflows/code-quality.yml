name: Code Quality
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing native platform scaffolding
        run: bash tool/regenerate_platforms.sh
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Check formatting
        run: dart format lib test
      - run: flutter analyze
      - run: flutter test
