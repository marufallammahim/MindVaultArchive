name: Feature Branch - Regression Tests

on:
  push:
    branches:
      - feature/ultimate-all-in-one-mindvault
  pull_request:
    branches:
      - feature/ultimate-all-in-one-mindvault
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindvault-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: Flutter unit and widget regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Flutter analyzer configuration is committed
        run: git diff --exit-code -- analysis_options.yaml

      - name: Generate Drift and Riverpod sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated sources are committed
        run: git diff --exit-code -- lib

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run all Flutter tests
        run: flutter test --concurrency=1 --reporter expanded
