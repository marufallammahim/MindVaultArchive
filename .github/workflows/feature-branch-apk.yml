name: Feature Branch - Android APK Artifact

on:
  push:
    branches:
      - feature/ultimate-all-in-one-mindvault
  pull_request:
    branches:
      - feature/ultimate-all-in-one-mindvault
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindvault-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build and publish installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Generate missing native platform scaffolding
        run: bash tool/regenerate_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Flutter analyzer configuration is committed
        run: git diff --exit-code -- analysis_options.yaml pubspec.lock

      - name: Generate Drift and Riverpod sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Normalize generated Drift binding
        run: dart format lib/core/database/database.g.dart

      - name: Verify generated sources and Dart formatting
        run: |
          git diff --exit-code -- lib
          dart format --output=none --set-exit-if-changed lib test

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Verify APK and create build metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/MindVaultArchive-debug.apk
          sha256sum dist/MindVaultArchive-debug.apk > dist/SHA256SUMS.txt
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')"
            echo "build_type=debug"
            echo "installable=true"
          } > dist/build-info.txt

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: MindVaultArchive-debug-${{ github.run_number }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
