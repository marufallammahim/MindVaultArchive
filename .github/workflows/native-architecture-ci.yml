name: Native Architecture CI

on:
  push:
    branches:
      - feature/hybrid-native-architecture
  pull_request:
    branches:
      - feature/hybrid-native-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  cpp:
    name: C++ native library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native/cpp -B build/native-cpp -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native-cpp --config Release --parallel 2
