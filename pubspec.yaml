name: mindvault_archive
description: A premium offline-first personal knowledge management application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  record: ^5.0.5
  just_audio: ^0.9.36
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  intl: ^0.18.1
  share_plus: ^7.2.1
  uuid: ^4.2.2
  permission_handler: ^11.1.1
  flutter_launcher_icons: ^0.13.1
  signature: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  drift_dev: ^2.14.0
  riverpod_generator: ^2.3.9
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7

flutter_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_logo.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/illustrations/generated/
    - assets/icons/generated/
