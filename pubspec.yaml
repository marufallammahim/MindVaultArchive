name: mindvault_archive
description: A premium offline-first personal knowledge management application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  just_audio: ^0.9.36
  flutter_svg: ^2.0.9
  flutter_markdown_plus: ^1.0.12
  file_picker: ^10.3.8
  share_plus: ^10.1.4
  archive: ^3.6.1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.1.0
  intl: ^0.20.3
  uuid: ^4.2.2
  permission_handler: ^11.1.1
  shared_preferences: ^2.2.2
  signature: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  drift_dev: ^2.14.0
  riverpod_generator: ^2.3.9
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/illustrations/generated/
    - assets/icons/generated/
