plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Load private signing data from android/key.properties (never commit this file).
def signingProperties = new java.util.Properties()
def signingPropertiesFile = rootProject.file("key.properties")
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

android {
    namespace "com.marufallammahim.mindvaultarchive"
    // Keep this independent from Flutter's default compile SDK: AndroidX
    // dependencies such as share_plus require API 34 or newer.
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.marufallammahim.mindvaultarchive"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (!signingPropertiesFile.exists()) {
                throw new GradleException("Missing android/key.properties. Configure a private release keystore before building a release.")
            }
            def storePath = signingProperties["storeFile"]
            if (storePath == null || storePath.toString().trim().isEmpty()) {
                throw new GradleException("key.properties must define storeFile")
            }
            storeFile file(storePath)
            storePassword signingProperties["storePassword"]
            keyAlias signingProperties["keyAlias"]
            keyPassword signingProperties["keyPassword"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}